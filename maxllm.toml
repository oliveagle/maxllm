# opencode.ai ("zen") provider — OpenAI-compatible but with stricter
# validation. The gateway normalises tool_choice / tool_call arguments /
# function names / reasoning_content to its schema and injects the required
# `x-opencode-session` header when the client did not send one. The Responses
# API is served natively (default for kind = "opencode"), so /v1/responses
# requests are forwarded to /zen/go/v1/responses byte-for-byte.
# [providers.opencode]
# kind = "opencode"
# base_url = "https://opencode.ai"
# upstream_path = "/zen/go/v1/chat/completions"
# api_key = "${OPENCODE_API_KEY}"
# default_model = "deepseek-v4.1-flash"
# # Optional: set true when the upstream does not require reasoning_content
# # to be passed back (echo collapse still runs).
# skip_reasoning_injection = false
# # The path to opencode.ai's Cloudflare edge can be slow/lossy from some
# # hosts (TCP connect measured up to 15s); widen the default 10s connect
# # budget so a slow-but-healthy upstream does not turn into a 502.
# connect_timeout_secs = 30
# total_connect_timeout_secs = 60

# commandcode.ai ("provider") — one key for Claude, GPT, Gemini and the open
# models. The vendor namespaces every route under /provider:
#   /provider/v1/responses        — OpenAI Responses contract (native)
#   /provider/v1/chat/completions — OpenAI Chat Completions contract
#   /provider/v1/messages         — Anthropic Messages contract (Claude only)
# The Responses route is the default for kind = "commandcode": /v1/responses
# requests are forwarded to /provider/v1/responses byte-for-byte.
[providers.cmd]
kind = "commandcode"
base_url = "https://api.commandcode.ai"
api_key = "${CMD_API_KEY}"
default_model = "deepseek/deepseek-v4.1-flash"

# The Claude models are served on the Anthropic Messages route only. Give
# them their own provider entry: the gateway then translates an OpenAI-format
# request into the Anthropic Messages contract (and the answer back), and a
# native /v1/messages request is forwarded to /provider/v1/messages.
# [providers.cmd_claude]
# kind = "commandcode"
# base_url = "https://api.commandcode.ai"
# upstream_path = "/provider/v1/messages"
# api_key = "${CMD_API_KEY}"
# default_model = "claude-sonnet-5-5"

# OpenDesign (open-design.ai) — the design workspace's "AMR link" endpoint.
# The workspace's cloud runtime reaches the model vendors through this
# OpenAI-compatible link, authenticated with an `sk-amr-…` key:
#   /v1/responses        — OpenAI Responses contract (native, streaming)
#   /v1/chat/completions — OpenAI Chat Completions contract
#   /v1/models           — the account's model catalogue
# The Responses route is the default for kind = "open_design": /v1/responses
# requests are forwarded to /v1/responses byte-for-byte.
# The gateway speaks the link's protocol natively — no `od` / `vela` CLI is
# spawned and no command is shelled out to.
# The gateway connects to the base_url's origin and routes to the link's own
# paths (/v1/chat/completions, /v1/responses, /v1/models); the `/v1` in the
# base_url is the link's published API prefix.
[providers.open_design]
kind = "open_design"
base_url = "https://amr-link.open-design.ai/v1"
api_key = "${OPEN_DESIGN_API_KEY}"
default_model = "deepseek-v4.1-flash"

# --- Routes ---

[[routes]]
path = "/v1/chat/completions"
provider = "openai"
fallback = ["anthropic"]
timeout_secs = 120
strategy = "fallback"
plugins = ["rate_limiter", "cors"]
# Replay a transient 5xx on the same provider before walking the fallback
# chain (0 = disabled):
# num_retries = 2
# retry_backoff_ms = 500
# guardrails = ["injection-guard", "pii-check", "secret-scan"]  # Only these guardrails run for this route

[[routes]]
path = "/v1/anthropic"
provider = "anthropic"
fallback = ["openai"]
plugins = ["rate_limiter", "cors"]
# guardrails = ["injection-guard"]  # Minimal guardrails for this route

[[routes]]
path = "/v1/ollama"
provider = "ollama"
timeout_secs = 120
plugins = ["rate_limiter", "cors"]
# guardrails = []  # Empty = all default_on guardrails apply

[[routes]]
path = "/v1/gemini"
provider = "gemini"
timeout_secs = 120
plugins = ["rate_limiter", "cors"]

# OpenDesign AMR link — the account's models behind one key. The gateway
# speaks the link's protocol natively (OpenAI Chat Completions + the OpenAI
# Responses contract).
[[routes]]
path = "/v1/open-design"
provider = "open_design"
timeout_secs = 120
plugins = ["rate_limiter", "cors"]

# Mock route for perf testing (no rate limit)
[[routes]]
path = "/v1/mock"
provider = "mock"
timeout_secs = 10
plugins = ["cors"]

# Bare proxy route — no plugins, pure routing + upstream (perf baseline)
[[routes]]
path = "/v1/proxy"
provider = "mock"
timeout_secs = 10
plugins = []

# --- Responses API Endpoint ---
# OpenAI Responses contract (input/instructions/output) — the gateway
# translates bidirectionally to chat completions for any provider kind.

# [[routes]]
# path = "/v1/responses"
# provider = "openai"
# endpoint_type = "responses"
# timeout_secs = 120
# plugins = ["rate_limiter", "cors"]

# commandcode.ai speaks the Responses contract natively, so this route
# forwards /v1/responses byte-for-byte to /provider/v1/responses.
# Per-provider Responses route. NOTE: route matching is PREFIX based, so a
# provider-specific path MUST be declared BEFORE any generic "/v1/responses"
# route -- otherwise the generic one swallows it (it matches first).
# [[routes]]
# path = "/v1/responses/cmd"
# provider = "cmd"
# endpoint_type = "responses"
# timeout_secs = 120
# plugins = ["rate_limiter", "cors"]

# The OpenDesign AMR link speaks the Responses contract natively too, so this
# route forwards the body byte-for-byte to /v1/responses.
# [[routes]]
# path = "/v1/responses/open-design"
# provider = "open_design"
# endpoint_type = "responses"
# timeout_secs = 120
# plugins = ["rate_limiter", "cors"]

# --- Native Provider Endpoints ---
# Accept provider-native request format directly (no translation).
# Clients use the provider's own SDK/format, gateway adds auth + logging.

# Anthropic Messages API (native format)
# curl -d '{"model":"claude-sonnet-4-20250514","max_tokens":1024,"messages":[...]}' /v1/messages
# [[routes]]
# path = "/v1/messages"
# provider = "anthropic"
# endpoint_type = "native"
# timeout_secs = 120
# plugins = ["rate_limiter", "cors"]

# commandcode.ai's Anthropic Messages route — the only route that serves the
# vendor's Claude models. A client posting to /v1/messages is forwarded to
# /provider/v1/messages (the gateway rewrites the path for a provider whose
# own upstream path is a /messages route).
# [[routes]]
# path = "/v1/messages"
# provider = "cmd_claude"
# endpoint_type = "native"
# timeout_secs = 120
# plugins = ["rate_limiter", "cors"]

# Gemini generateContent API (native format)
# curl -d '{"contents":[{"parts":[{"text":"Hello"}]}]}' /v1beta/models/gemini-2.5-flash:generateContent
# [[routes]]
# path = "/v1beta/models"
# provider = "gemini"
# endpoint_type = "native"
# timeout_secs = 120
# plugins = ["rate_limiter", "cors"]

# --- Pass-Through Endpoints ---
# Raw proxy to provider APIs — zero body parsing or translation.
# Client-supplied path suffix is forwarded to the provider's base URL.

# Pass-through to Anthropic (any endpoint)
# curl /passthrough/anthropic/v1/messages -d '...'
# [[routes]]
# path = "/passthrough/anthropic"
# provider = "anthropic"
# endpoint_type = "passthrough"
# plugins = ["rate_limiter"]

# Pass-through to OpenAI (any endpoint)
# curl /passthrough/openai/v1/chat/completions -d '...'
# [[routes]]
# path = "/passthrough/openai"
# provider = "openai"
# endpoint_type = "passthrough"
# plugins = ["rate_limiter"]

# Pass-through to Gemini (any endpoint)
# curl /passthrough/gemini/v1beta/models/gemini-2.5-flash:generateContent -d '...'
# [[routes]]
# path = "/passthrough/gemini"
# provider = "gemini"
# endpoint_type = "passthrough"
# plugins = ["rate_limiter"]

