# MaxLLM Gateway Configuration
# Environment variables can be referenced with ${VAR_NAME} syntax.

# Global plugins run on every request, in order.
global_plugins = ["request_id", "api_auth"]

[server]
listen = "0.0.0.0:8080"
threads = 4
# SO_REUSEPORT on the listening socket (kernel-level load balancing).
# tcp_reuseport = true
# TCP fast open backlog on the listening socket.
# tcp_fastopen = 256
# Seconds to drain in-flight requests on SIGTERM before the runtimes are
# torn down. Pingora's own default is 300s, which outlives the service
# manager's stop timeout and ends in a SIGKILL mid-shutdown. Default: 30.
# grace_period_secs = 30

[metrics]
enabled = true

# --- Cost accounting ---
# `enabled = false` books every request at 0 (budgets become advisory) and
# `warn_on_missing = false` silences the per-request "no cost entry" warning
# for a model outside the table. The built-in table already covers the
# production cloud channels and gives self-hosted / prepaid-plan models an
# explicit 0/0 row; override any of them below with the contract price.
[costs]
enabled = true
warn_on_missing = false

# --- Model Aliases ---
# Map requested model names to actual model names.
[model_aliases]
"gpt-4" = "gpt-4o"
"claude-3" = "claude-sonnet-4-20250514"

# --- Admin API (optional) ---
[admin]
master_key = "sk-maxllm-dev-key"
enabled = true
db_path = "maxllm.db"

# --- Model Cost Overrides (supplement built-in costs) ---
# USD per 1M tokens. An exact key replaces the built-in row; a key with `*`
# or `?` is a glob checked after exact matches.
# [model_costs."custom-model"]
# input_per_1m = 1.00
# output_per_1m = 3.00

# --- Plugins ---

[plugins.request_id]
category = "request_id"
header_name = "X-Request-Id"

[plugins.api_auth]
category = "key_auth"
header = "Authorization"
strip_prefix = "Bearer "
keys = ["sk-maxllm-dev-key"]

# [plugins.ip_guard]
# category = "ip_restriction"
# type = "deny"
# ip_list = ["10.0.0.0/8"]

[plugins.rate_limiter]
category = "rate_limit"
requests_per_minute = 600
key = "client_ip"

[plugins.cors]
category = "cors"
allow_origin = "*"
allow_methods = "GET, POST, OPTIONS"
allow_headers = "Content-Type, Authorization"
max_age = "86400"

